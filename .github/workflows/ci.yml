name: Emacs package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '31.1'
      - name: Install declared dependencies and package-lint
        run: make bootstrap
      - name: Compile, test, lint, build and install package
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: org-workflow-package
          path: dist/org-workflow-*.tar
